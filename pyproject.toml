[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spline-encoder"
version = "0.1.0"
description = "Continuous-first B-spline encoding for action chunks and LeRobot datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SplineEncoder contributors"}]
keywords = ["robotics", "lerobot", "b-spline", "tokenization", "actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.15",
]

[project.optional-dependencies]
lerobot = [
  "pandas>=2.0",
  "pyarrow>=12",
]
test = [
  "h5py>=3.8",
  "pandas>=2.0",
  "pyarrow>=12",
  "pytest>=8",
]

[project.scripts]
spline-encode = "spline_encoder.cli:main"

[project.urls]
Repository = "https://github.com/outsider86/BSplineEncoder"

[tool.hatch.build.targets.wheel]
packages = ["src/spline_encoder"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
